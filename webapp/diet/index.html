<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kalorien-Coach</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  .app{
    --bg:#10121c; --sec:#232532; --sec2:#1a1d29; --text:#e9e9ed; --hint:#797f93;
    --acc:#9184d9; --accsoft:rgba(145,132,217,0.16); --btntext:#f4f3fb;
    --danger:#d0736f; --dangersoft:rgba(208,115,111,0.15);
    --div:rgba(233,233,237,0.09); --divs:rgba(233,233,237,0.14);
    --ck:#F97316; --cp:#F43F5E; --cc:#3B82F6; --cf:#EAB308; --cs:#A855F7; --cg:#22C55E;
    --track:rgba(233,233,237,0.10);
  }
  .app[data-theme="light"]{
    --bg:#e7e9f3; --sec:#f9fafe; --sec2:#eef0f8; --text:#232532; --hint:#75798c;
    --acc:#6f63c3; --accsoft:rgba(111,99,195,0.12); --btntext:#f9fafe;
    --danger:#b23b3b; --dangersoft:rgba(178,59,59,0.10);
    --div:rgba(35,37,50,0.10); --divs:rgba(35,37,50,0.16);
    --track:rgba(35,37,50,0.10);
  }
  body{font-family:'Inter',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);padding-top:var(--tg-safe-top,0px)}
  .app[data-theme="dark"]{color-scheme:dark}.app[data-theme="light"]{color-scheme:light}
  .hdr{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid var(--div)}
  .hdr .title{font-size:16px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr .sub{font-size:11px;color:var(--hint);font-weight:400}
  .hdr .side{min-width:64px;display:flex;align-items:center}
  .hdr .side.r{justify-content:flex-end}
  .lnk{border:none;background:none;color:var(--acc);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:6px 8px}
  .icobtn{width:40px;height:40px;border:none;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-size:19px;cursor:pointer}
  .icobtn.plain{background:var(--sec)}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .22s ease both}
  .foot{flex:none;padding:12px 20px calc(16px + var(--tg-safe-bottom, env(safe-area-inset-bottom)));background:var(--bg)}
  .mainbtn{width:100%;height:52px;border:none;border-radius:14px;font:inherit;font-size:16px;font-weight:600;background:var(--acc);color:var(--btntext);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .mainbtn.danger{background:var(--danger)}
  .mainbtn[disabled]{opacity:.45;cursor:default}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes toastin{0%{opacity:0;transform:translate(-50%,12px)}12%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
  @keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .pad{padding:14px 20px 22px}
  .card{background:var(--sec);border-radius:16px}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--divs);border-top-color:var(--acc);animation:spin .8s linear infinite;margin:40px auto}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
  .center .em{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--accsoft);color:var(--acc);margin-bottom:22px;font-size:42px}
  .tin{width:100%;height:50px;font:inherit;font-size:16px;padding:0 16px;background:var(--sec);color:var(--text);border:1px solid var(--div);border-radius:12px;outline:none;caret-color:var(--acc)}
  .tin.err{border-color:var(--danger)}
  .tin:focus{border-color:var(--acc)}
  .lab{font-size:12px;color:var(--hint);margin:0 2px 6px}
  .lab.sp{display:flex;justify-content:space-between}
  .errline{font-size:11px;color:var(--danger);margin-top:5px}
  .seg{display:flex;background:var(--sec);border-radius:12px;padding:4px;gap:2px}
  .seg button{flex:1;border:none;cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:9px 6px;border-radius:9px;background:transparent;color:var(--hint)}
  .seg button.on{background:var(--acc);color:var(--btntext)}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .cell{height:52px;border:none;cursor:pointer;font:inherit;font-size:17px;font-weight:600;border-radius:14px;background:var(--sec);color:var(--text)}
  .cell.on{background:var(--acc);color:var(--btntext)}
  .navrow{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--div);cursor:pointer}
  .navrow.last{border-bottom:none}
  .tile{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--accsoft);color:var(--acc);font-size:19px}
  .tile.d{background:var(--dangersoft);color:var(--danger)}
  .chev{color:var(--hint);opacity:.7;font-size:18px}
  .dots{display:flex;gap:7px;margin-bottom:22px}
  .dots i{flex:1;height:5px;border-radius:9px;background:var(--div)}
  .dots i.on{background:var(--acc)}
  .qcard{width:100%;text-align:left;border:1px solid var(--div);background:var(--sec);border-radius:16px;padding:18px;cursor:pointer;font:inherit;color:var(--text);display:flex;align-items:center;gap:12px}
  .qcard.on{border-color:var(--acc);background:var(--accsoft)}
  .qcard .qt{font-size:16px;font-weight:600}
  .qcard .qs{font-size:12px;color:var(--hint);margin-top:2px}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--sec);color:var(--text);box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 0 1px var(--divs);border-radius:12px;padding:11px 18px;font-size:14px;font-weight:500;z-index:40;animation:toastin 2.2s ease both;max-width:88%;text-align:center}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:28px}
  .dialog{background:var(--sec);border-radius:18px;padding:24px 22px;max-width:330px;width:100%;text-align:center;animation:pop .18s ease both}
  .dialog .warn{width:56px;height:56px;border-radius:50%;background:var(--dangersoft);color:var(--danger);display:grid;place-items:center;margin:0 auto 16px;font-size:26px}
  .dialog h3{margin:0 0 8px;font-size:18px}
  .dialog p{margin:0 0 18px;font-size:13px;color:var(--hint);line-height:1.5}
  .dbtn{width:100%;height:48px;border:none;border-radius:12px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .dbtn.danger{background:var(--danger);color:var(--btntext)}
  .dbtn.cancel{background:transparent;color:var(--text)}
  .sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:50}
  .sheet{width:100%;background:var(--sec);border-radius:24px 24px 0 0;padding:14px 20px calc(24px + var(--tg-safe-bottom,env(safe-area-inset-bottom)));box-shadow:0 -20px 50px rgba(0,0,0,.4);animation:sheetin .24s cubic-bezier(.2,.8,.2,1) both}
  .sheet .handle{width:38px;height:5px;border-radius:9px;background:var(--divs);margin:2px auto 16px}
  .sheet .sr{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;background:var(--sec2);cursor:pointer;margin-bottom:10px}
  .macbar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
  .mealhd{display:flex;justify-content:space-between;font:600 12px/1 inherit;letter-spacing:.05em;text-transform:uppercase;color:var(--hint);margin:0 2px 8px}
  .entry{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--sec);cursor:pointer}
  .toggle{width:46px;height:27px;border-radius:99px;background:var(--divs);position:relative;flex:none;cursor:pointer;transition:background .15s}
  .toggle.on{background:var(--acc)}
  .toggle i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on i{left:22px}
  .granwarn{font-size:12px;color:var(--hint);text-align:center;margin-top:10px;line-height:1.4}
  .favrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--sec);cursor:pointer}
  .favrow.on{background:var(--accsoft);box-shadow:inset 0 0 0 1px var(--acc)}
  .addbtn{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--btntext);display:grid;place-items:center;font-size:18px;flex:none;cursor:pointer;border:none;font-weight:700}
  .ghostbtn{width:100%;padding:13px;border:1px solid var(--divs);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px}
</style>
</head>

// ---------------- api ----------------
async function api(path, opts){
  opts=opts||{};
  const headers=Object.assign({"Content-Type":"application/json","X-Telegram-Init-Data":INIT}, opts.headers||{});
  const res=await fetch(API+path,{method:opts.method||"GET",headers,body:opts.body?JSON.stringify(opts.body):undefined});
  if(res.status===403){ let d=null; try{d=await res.json();}catch(e){} throw {status:403,detail:d&&d.detail,consent:!d||d.detail==="no consent"}; }
  if(!res.ok){ throw new Error("http "+res.status); }
  return res.status===204?null:res.json();
}
function cacheGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function cacheSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

// ---------------- helpers ----------------
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==="style")e.setAttribute("style",attrs[k]);
    else if(k==="class")e.className=attrs[k];
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==="disabled"){ if(attrs[k])e.setAttribute("disabled",""); }
    else e.setAttribute(k,attrs[k]);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false)continue;
    e.appendChild(typeof kid==="string"||typeof kid==="number"?document.createTextNode(String(kid)):kid); }
  return e;
}
function seg(opts,val,on){ return h("div",{class:"seg"},opts.map(o=>h("button",{class:o.v===val?"on":"",onClick:()=>on(o.v)},o.l))); }

  const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; const dt=new Date(y,mo-1,d);
  return WDAYS()[dt.getDay()]+", "+d+" "+MON()[mo-1]; }
function WDAYS(){ return {en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],ru:["Вс","Пн","Вт","Ср","Чт","Пт","Сб"],de:["So","Mo","Di","Mi","Do","Fr","Sa"],uk:["Нд","Пн","Вт","Ср","Чт","Пт","Сб"]}[S.lang]; }
function MON(){ return {en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ru:["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"],de:["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"],uk:["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"]}[S.lang]; }
function mealByHour(){ const hh=(S.now&&S.now.hh)||12; if(hh<11)return"breakfast"; if(hh<16)return"lunch"; if(hh<21)return"dinner"; return"snack"; }

  return {kcal:r(fd.kcal_100),protein:Math.round((fd.protein_100||0)*f),carb:Math.round((fd.carb_100||0)*f),fat:Math.round((fd.fat_100||0)*f)}; }

// В визарде «назад» = предыдущий шаг, а не выход из экрана.
function handleBack(){

// ---------------- loaders ----------------
async function loadDay(dateISO){
  const cached=cacheGet("cache.diet.day."+(dateISO||todayISO()));
  if(cached){ applyDay(cached); S.dayState="ready"; }
  else S.dayState="loading";
  // если ещё не знаем экран — решим после ответа
  render();
  try{
    const d=await api("/api/diet/day"+(dateISO?("?date="+dateISO):""));
    applyDay(d); S.dayState="ready";
    cacheSet("cache.diet.day."+d.date,d);
    routeAfterDay(d);
    render();
  }catch(e){
    if(e&&e.consent){ S.screen="consent"; render(); }
    else if(!cached){ S.dayState="error"; if(S.screen==="loading")S.screen="home"; render(); }
    else { routeAfterDay(cached); render(); }
  }
}
function applyDay(d){ S.now=d.now; S.date=d.date; S.profile=d.profile; S.day=d; }
function routeAfterDay(d){
  if(!d.profile){ if(S.screen==="loading"||S.screen==="home"){ S.screen="welcome"; S.history=[]; } }
  else if(S.screen==="loading"){ S.screen="home"; S.history=[]; }
}

  const body=h("div",{class:"body"}, renderScreen());

    app.appendChild(h("div",{class:"foot"}, h("button",{class:"mainbtn"+(cfg.danger?" danger":""),disabled:dis,onClick:dis?null:cfg.on}, S.busy?"…":cfg.label))); }

}

function wizError(){

function wizStepValid(){
  const step=S.wizStep, w=S.wiz, n=v=>v===""||v==null?null:Number(v);
  if(step===0) return n(w.age)!=null&&n(w.age)>=10&&n(w.age)<=120;
  if(step===1) return n(w.height)!=null&&n(w.height)>=100&&n(w.height)<=250;
  if(step===2) return n(w.weight)!=null&&n(w.weight)>=30&&n(w.weight)<=300;
  if(step===3) return !!w.goal;
  if(step===4) return !!w.activity;

  searchInp.value=S.favSearch;
  return h("div",{},
    h("div",{style:"padding:8px 20px 4px"}, searchInp),
    h("div",{id:"favlist",style:"padding:12px 20px 20px"}, favListEl()));
}
function favListEl(){
  const q=S.favSearch.trim().toLowerCase();
  const list=S.favs.filter(f=>!q||f.name.toLowerCase().includes(q));
  if(!list.length) return h("div",{style:"text-align:center;color:var(--hint);font-size:13px;padding:24px"},T("noFavFiltered"));
  return h("div",{style:"display:flex;flex-direction:column;gap:9px"}, list.map(favRow));
}
function renderFavList(){ const el=document.getElementById("favlist"); if(el){ el.innerHTML=""; el.appendChild(favListEl()); } }
function favRow(f){
  const bulk=S.favBulk, checked=bulk.on&&bulk.sel.includes(f.fav_id);
  return h("div",{class:"favrow"+(checked?" on":""),onClick:()=>{ if(bulk.on)toggleFavSel(f.fav_id); else openFavAmount(f); }},
    bulk.on
      ? h("div",{style:"width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;"+(checked?"background:var(--acc);color:var(--btntext)":"border:2px solid var(--divs)")}, checked?"✓":"")
      : h("div",{style:"font-size:19px;color:var(--acc)"},"⭐"),
    h("div",{style:"flex:1;min-width:0"}, h("div",{style:"font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"},f.name),
      h("div",{style:"font-size:11px;color:var(--hint)"}, Math.round(f.kcal_100)+" kcal · "+Math.round(f.protein_100)+" g "+T("protein").toLowerCase()+" "+T("perServing"))),
    bulk.on? null : h("button",{class:"addbtn",onClick:e=>{e.stopPropagation(); guard(()=>quickAddFav(f));}},"＋"));
}
function toggleFavSel(id){ const i=S.favBulk.sel.indexOf(id); if(i>=0)S.favBulk.sel.splice(i,1); else S.favBulk.sel.push(id); render(); }
async function quickAddFav(f){
  await api("/api/diet/entries",{method:"POST",body:{date:S.date,meal:mealByHour(),food_id:f.food_id,amount:f.default_amount||100,unit:"g"}});
  try{ localStorage.removeItem("cache.diet.day."+S.date); }catch(e){}
  toast(T("added"));
}
function openFavAmount(f){
  S.food={id:f.food_id,name:f.name,kcal_100:f.kcal_100,protein_100:f.protein_100,fat_100:f.fat_100,carb_100:f.carb_100,sugar_100:f.sugar_100};
  S.amount=f.default_amount||100; S.unit="g"; S.addMeal=mealByHour(); go("amount");
}
async function addFavCurrent(){
  if(S.busy||!S.food||!S.food.id)return; S.busy=true; render();
  try{ await api("/api/diet/favorites",{method:"POST",body:{food_id:S.food.id,default_amount:S.amount}}); try{localStorage.removeItem("cache.diet.favs");}catch(e){} S.busy=false; toast(T("favSaved")); }
  catch(e){ S.busy=false; toast(e&&e.status===403&&e.detail==="fav limit"?T("favLimit"):T("errGeneric")); }
}

// ---------------- SETTINGS (mini) ----------------
function scSettings(){
  return h("div",{class:"pad",style:"display:flex;flex-direction:column;gap:16px"},
    h("div",{}, h("div",{class:"lab"},T("theme")),
      seg([{v:"auto",l:T("themeAuto")},{v:"light",l:T("themeLight")},{v:"dark",l:T("themeDark")}], S.themePref, setThemePref)),
    h("div",{class:"card"}, navRow("🎯",T("changeGoal"),"",()=>startWizard(),true)),
    h("div",{class:"card"}, navRow("🌐",LANGNAME[S.lang],"",()=>{S.sheet="lang";render();},true)));
}

// ---------------- dialog ----------------
function renderDialog(){
  const dg=S.dialog; let title,body=T("cantUndo"),onYes;
  if(dg.type==="delEntry"){ title=T("delEntryTitle"); onYes=async()=>{ await api("/api/diet/entries/"+dg.id,{method:"DELETE"}); try{localStorage.removeItem("cache.diet.day."+S.date);}catch(e){} S.dialog=null; await loadDay(S.date); toast(T("deleted")); }; }
  else if(dg.type==="delSel"){ title=T("delSelTitle"); onYes=async()=>{ await api("/api/diet/entries/bulk_delete",{method:"POST",body:{ids:S.bulk.sel}}); try{localStorage.removeItem("cache.diet.day."+S.date);}catch(e){} S.bulk={on:false,sel:[]}; S.dialog=null; await loadDay(S.date); toast(T("deleted")); }; }
  else if(dg.type==="delFavSel"){ title=T("delSelTitle"); onYes=async()=>{ await api("/api/diet/favorites/bulk_delete",{method:"POST",body:{ids:S.favBulk.sel}}); try{localStorage.removeItem("cache.diet.favs");}catch(e){} S.favBulk={on:false,sel:[]}; S.dialog=null; await loadFavorites(); toast(T("deleted")); }; }
  return h("div",{class:"overlay",onClick:e=>{if(e.target.className==="overlay"&&!S.busy){S.dialog=null;render();}}},
    h("div",{class:"dialog"}, h("div",{class:"warn"},"⚠️"), h("h3",{},title), h("p",{},body),
      h("button",{class:"dbtn danger",disabled:S.busy,onClick:S.busy?null:()=>guard(onYes)}, S.busy?"…":T("del")),
      h("button",{class:"dbtn cancel",disabled:S.busy,onClick:S.busy?null:()=>{S.dialog=null;render();}},T("cancel"))));
}

// bulk delete footer for diary
function diaryBulkCfg(){ return {label:T("deleteSelected")+(S.bulk.sel.length?" ("+S.bulk.sel.length+")":""),danger:true,disabled:!S.bulk.sel.length,on:()=>{S.dialog={type:"delSel"};render();}}; }

// override mainCfg for diary bulk (added here to keep switch simple)
const _mainCfg=mainCfg;
mainCfg=function(){
  if(S.screen==="diary"&&S.bulk.on) return diaryBulkCfg();
  if(S.screen==="favorites"){
    if(S.favBulk.on) return {label:T("deleteSelected")+(S.favBulk.sel.length?" ("+S.favBulk.sel.length+")":""),danger:true,disabled:!S.favBulk.sel.length,on:()=>{S.dialog={type:"delFavSel"};render();}};
    if(!S.favs.length&&S.favState==="ready") return {label:"＋ "+T("addFood"),on:()=>openAdd(mealByHour())};
    return null;
  }
  return _mainCfg();
};

// footer-only refresh (без пересборки экрана — не теряем фокус в полях)
function updateFooter(){
  const cfg=mainCfg(); const app=document.querySelector(".app"); if(!app)return;
  let foot=app.querySelector(".foot");
  if(!cfg){ if(foot)foot.remove(); return; }
  if(!foot){ foot=h("div",{class:"foot"}); app.appendChild(foot); }
  foot.innerHTML=""; const dis=cfg.disabled||S.busy;
  foot.appendChild(h("button",{class:"mainbtn"+(cfg.danger?" danger":""),disabled:dis,onClick:dis?null:cfg.on}, S.busy?"…":cfg.label));
}

// ---------------- theme ----------------
function computeTheme(){ return S.themePref==="auto"?((tg&&tg.colorScheme)||"dark"):S.themePref; }
function applyTgColors(){ if(!tg)return; const bg=S.theme==="light"?"#e7e9f3":"#10121c";
  try{ tg.setBackgroundColor&&tg.setBackgroundColor(bg); }catch(e){} try{ tg.setHeaderColor&&tg.setHeaderColor(bg); }catch(e){} }
function setThemePref(p){ S.themePref=p; S.theme=computeTheme(); try{localStorage.setItem("diet.themePref",p);}catch(e){} applyTgColors(); render(); }

// ---------------- init ----------------
function applyInsets(){ if(!tg)return; const sa=tg.safeAreaInset||{}, ca=tg.contentSafeAreaInset||{};
  document.documentElement.style.setProperty("--tg-safe-top",((sa.top||0)+(ca.top||0))+"px");
  document.documentElement.style.setProperty("--tg-safe-bottom",((sa.bottom||0)+(ca.bottom||0)+8)+"px"); }
if(tg){ tg.ready(); tg.expand();
  if(tg.requestFullscreen){ try{ tg.requestFullscreen(); }catch(e){} }
  applyInsets();
  try{ const lc=(tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code||"en").slice(0,2); if(["ru","de","uk","en"].includes(lc))S.lang=lc; }catch(e){}
  const re=(ev,fn)=>tg.onEvent&&tg.onEvent(ev,fn);
  re("themeChanged",()=>{ if(S.themePref==="auto"){ S.theme=tg.colorScheme; render(); } });
  re("fullscreenChanged",applyInsets); re("safeAreaChanged",applyInsets); re("contentSafeAreaChanged",applyInsets); re("viewportChanged",applyInsets);
  tg.BackButton&&tg.BackButton.onClick(handleBack);
}
try{ const tp=localStorage.getItem("diet.themePref"); if(["auto","light","dark"].includes(tp))S.themePref=tp; const l=localStorage.getItem("diet.lang"); if(l&&["ru","en","de","uk"].includes(l))S.lang=l; }catch(e){}
S.theme=computeTheme(); applyTgColors();
render();
loadDay();
</script>
</body>
</html>
