<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reminders</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  .app{
    --bg:#10121c; --sec:#232532; --sec2:#1a1d29; --text:#e9e9ed; --hint:#797f93;
    --acc:#9184d9; --accsoft:rgba(145,132,217,0.16); --btntext:#f5f4ff;
    --danger:#d0736f; --dangersoft:rgba(208,115,111,0.15);
    --div:rgba(233,233,237,0.09); --divs:rgba(233,233,237,0.14);
  }
  .app[data-theme="light"]{
    --bg:#e7e9f3; --sec:#f9fafe; --sec2:#eef0f8; --text:#232532; --hint:#75798c;
    --acc:#6f63c3; --accsoft:rgba(111,99,195,0.12); --btntext:#f9fafe;
    --danger:#b23b3b; --dangersoft:rgba(178,59,59,0.10);
    --div:rgba(35,37,50,0.10); --divs:rgba(35,37,50,0.16);
  }
  body{font-family:'Inter',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text)}
  .app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    padding-top:var(--tg-safe-top,0px)}
  .hdr{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 8px;border-bottom:1px solid var(--div)}
  .hdr .title{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .hdr .side{min-width:76px;display:flex;align-items:center}
  .hdr .side.r{justify-content:flex-end}
  .lnk{border:none;background:none;color:var(--acc);font:inherit;font-size:16px;
    font-weight:500;cursor:pointer;padding:6px 8px}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .2s ease both}
  .foot{flex:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
  .mainbtn{width:100%;height:50px;border:none;border-radius:12px;font:inherit;font-size:16px;
    font-weight:600;background:var(--acc);color:var(--btntext);cursor:pointer}
  .mainbtn.danger{background:var(--danger)}
  .mainbtn[disabled]{opacity:.45;cursor:default}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes toastin{0%{opacity:0;transform:translate(-50%,12px)}12%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
  .row{display:flex;align-items:center;gap:13px;padding:13px 18px;border-bottom:1px solid var(--div);cursor:pointer}
  .row .ic{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:17px}
  .row .meta{flex:1;min-width:0}
  .row .top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--hint)}
  .row .txt{font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .paused{color:var(--hint)}
  .sectitle{margin:8px 18px 6px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);
    display:flex;justify-content:space-between;align-items:center}
  .card{background:var(--sec)}
  .big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:none;cursor:pointer;
    font:inherit;background:var(--sec);border-radius:14px;padding:18px;color:var(--text)}
  .big .em{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:var(--accsoft);font-size:23px}
  .big .l1{font-size:16.5px;font-weight:600}
  .big .l2{font-size:13px;color:var(--hint);margin-top:2px}
  .chip{border:1px solid var(--divs);background:var(--sec);color:var(--text);cursor:pointer;font:inherit;
    font-size:13.5px;font-weight:500;padding:9px 14px;border-radius:20px}
  .seg{display:flex;background:var(--sec2);border-radius:10px;padding:3px;gap:2px}
  .seg button{flex:1;border:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;
    padding:9px 6px;border-radius:8px;background:transparent;color:var(--hint)}
  .seg button.on{background:var(--acc);color:var(--btntext)}
  .grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{aspect-ratio:1;border:none;cursor:pointer;font:inherit;font-size:15px;font-weight:600;
    border-radius:10px;background:var(--sec);color:var(--text)}
  .cell.on{background:var(--acc);color:var(--btntext)}
  .span{border:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;border-radius:10px;
    padding:12px 0;background:var(--sec);color:var(--text)}
  .span.on{background:var(--acc);color:var(--btntext)}
  .pad{padding:16px}
  .lab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);margin:0 4px 8px}
  .hint{font-size:13px;color:var(--hint);margin:0 4px 10px}
  .wheels{display:flex;justify-content:center;gap:6px}
  .wheel{height:180px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding:70px 0;text-align:center}
  .wheel::-webkit-scrollbar{display:none}
  .wheel .it{height:40px;line-height:40px;scroll-snap-align:center;font-size:22px;font-weight:600;
    color:var(--hint);cursor:pointer}
  .wheel .it.on{color:var(--acc);font-size:26px}
  .wcolon{align-self:center;font-size:24px;font-weight:700}
  .preview{text-align:center;font-size:13.5px;color:var(--hint);margin-top:14px}
  .preview b{color:var(--text)}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer}
  .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--divs)}
  .dot.on{background:var(--acc);border-color:var(--acc)}
  .warn{display:flex;gap:9px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:10px;
    background:var(--dangersoft);color:var(--danger);font-size:13px}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 44px}
  .center .em{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
    background:var(--sec);margin-bottom:20px;font-size:32px}
  .pill{border:none;background:var(--accsoft);color:var(--acc);font:inherit;font-size:15px;font-weight:600;
    padding:11px 22px;border-radius:22px;cursor:pointer;margin-top:8px}
  .ta{width:100%;min-height:120px;border:none;border-radius:14px;background:var(--sec);color:var(--text);
    font:inherit;font-size:16px;padding:16px;resize:none;outline:none}
  .app[data-theme="dark"]{color-scheme:dark}
  .app[data-theme="light"]{color-scheme:light}
  .timeinput{font:inherit;font-weight:600;font-size:34px;background:var(--sec);color:var(--text);
    border:none;border-radius:14px;padding:14px 22px;text-align:center;outline:none}
  .timeinput.big{font-size:46px;padding:20px 28px}
  .numsel{font:inherit;font-weight:600;font-size:18px;background:var(--sec);color:var(--text);
    border:none;border-radius:12px;padding:13px 20px;text-align:center;outline:none;min-width:120px}
  .granwarn{font-size:12px;color:var(--hint);text-align:center;margin-top:10px;line-height:1.4}
  .ngrid{display:grid;gap:6px}
  .ncell{border:none;cursor:pointer;font:inherit;font-size:15px;font-weight:600;border-radius:9px;
    padding:12px 0;background:var(--sec);color:var(--text)}
  .ncell.on{background:var(--acc);color:var(--btntext)}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--sec);
    color:var(--text);box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 0 1px var(--divs);border-radius:12px;
    padding:11px 18px;font-size:14px;font-weight:500;z-index:30;animation:toastin 2.2s ease both}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40;padding:28px}
  .dialog{background:var(--sec);border-radius:16px;padding:20px;max-width:320px;width:100%;text-align:center}
  .dialog h3{margin:0 0 8px;font-size:18px}
  .dialog p{margin:0 0 18px;font-size:14px;color:var(--hint)}
  .dialog .btns{display:flex;flex-direction:column;gap:8px}
  .dbtn{height:46px;border:none;border-radius:11px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .dbtn.danger{background:var(--danger);color:var(--btntext)}
  .dbtn.cancel{background:var(--sec2);color:var(--text)}
  .detcard{margin:16px;background:var(--sec);border-radius:16px;padding:20px}
  .detcard .dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint)}
  .detcard .dv{font-size:16px;font-weight:600;margin:4px 0 16px}
  .act{display:flex;gap:10px;margin:0 16px}
  .act button{flex:1;border:none;border-radius:12px;font:inherit;font-size:14px;font-weight:600;
    padding:14px 0;background:var(--sec);color:var(--text);cursor:pointer}
  .act button.danger{color:var(--danger)}
  .spinner{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--divs);border-top-color:var(--acc);
    animation:spin .8s linear infinite;margin:20px auto}
  /* ---- главное меню (Home) ---- */
  .greet{padding:8px 4px}
  .greet .g1{font-size:23px;font-weight:600;letter-spacing:-.01em}
  .greet .g2{font-size:14px;color:var(--hint);margin-top:3px}
  .mrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;cursor:pointer;
    font:inherit;background:var(--sec);border-radius:16px;padding:14px;color:var(--text)}
  .mrow .em{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;
    background:var(--accsoft);font-size:23px}
  .mrow .l1{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .mrow .l2{font-size:13px;color:var(--hint);margin-top:2px}
  .badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px}
  .mrow.admin{background:var(--sec2);border:1px dashed var(--divs)}
  .reqbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--acc);
    background:transparent;color:var(--acc);cursor:pointer;font:inherit;font-size:15px;font-weight:600;
    padding:13px;border-radius:14px;margin-top:6px}
  /* ---- нижняя шторка (bottom sheet) ---- */
  @keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
  .sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:40}
  .sheet{width:100%;background:var(--sec);border-radius:20px 20px 0 0;
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4);
    animation:sheetin .24s cubic-bezier(.2,.8,.2,1) both}
  .sheet .handle{width:38px;height:4px;border-radius:2px;background:var(--divs);margin:2px auto 16px}
  .sheet .msg{text-align:center;padding:2px 4px 0}
  .sheet .msg .cir{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
    background:var(--accsoft);margin:0 auto 14px;font-size:28px}
  .sheet .msg h3{margin:0 0 8px;font-size:19px}
  .sheet .msg p{margin:0 0 20px;font-size:14.5px;color:var(--hint);line-height:1.5}
  .langlist{background:var(--sec2);border-radius:12px;overflow:hidden}
  .langlist button{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;
    background:transparent;cursor:pointer;font:inherit;font-size:16px;color:var(--text);padding:14px 16px;
    border-bottom:1px solid var(--div)}
  .langlist button:last-child{border-bottom:none}
  .policycard{flex:1;overflow-y:auto;background:var(--sec);border-radius:16px;padding:16px 16px 6px;
    border:1px solid var(--div);min-height:0}
  .policycard p{margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--hint)}
  .policycard h4{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 6px}
  .consentbtns{flex:none;display:flex;gap:10px;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
  .consentbtns .agree{flex:1;height:50px;border:none;border-radius:12px;cursor:pointer;font:inherit;
    font-size:16px;font-weight:600;background:var(--acc);color:var(--btntext)}
  .consentbtns .decline{flex:none;min-width:118px;height:50px;border:1px solid var(--divs);border-radius:12px;
    cursor:pointer;font:inherit;font-size:16px;font-weight:600;background:transparent;color:var(--hint)}
  /* ---- Полка памяти (Notes) ---- */
  .tin{width:100%;font:inherit;font-size:16px;padding:13px 14px;background:var(--sec);color:var(--text);
    border:1px solid var(--div);border-radius:12px;outline:none;caret-color:var(--acc)}
  .slab{font-size:12px;color:var(--hint);margin:0 2px 8px;font-weight:500}
  .counter{font-size:12px;color:var(--hint);text-align:right;margin-top:6px}
  .notecard{background:var(--sec);border-radius:16px;padding:16px;font-size:15.5px;line-height:1.6;
    white-space:pre-wrap;border:1px solid var(--div)}
  .emptyb{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:60px 44px 20px}
  .emptyb .em{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--sec);
    margin-bottom:18px;font-size:30px}
  .delrow{display:flex;justify-content:center;padding:22px 0 10px}
  .dellink{border:none;background:none;cursor:pointer;font:inherit;font-size:14px;font-weight:600;
    color:var(--danger);display:inline-flex;align-items:center;gap:7px}
  .editbtns{display:flex;gap:10px;margin-top:14px}
  .editbtns button{flex:1;height:46px;border-radius:12px;cursor:pointer;font:inherit;font-size:15px;
    font-weight:600;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .editbtns .edit{border:1px solid var(--divs);color:var(--text)}
  .editbtns .del{border:1px solid var(--danger);color:var(--danger)}
</style>
</head>

// ---------------- API ----------------
async function api(path, opts){
  opts = opts||{};
  const headers = Object.assign({"Content-Type":"application/json","X-Telegram-Init-Data":INIT}, opts.headers||{});
  const res = await fetch(API+path, {method:opts.method||"GET", headers, body:opts.body?JSON.stringify(opts.body):undefined});
  if(res.status===403){
    // 403 = либо нет согласия (экран согласия), либо модуль off/prime (шторка).
    let d=null; try{ d=await res.json(); }catch(e){}
    throw {status:403, detail:d&&d.detail, consent: !d || d.detail==="no consent"};
  }
  if(!res.ok){ throw new Error("http "+res.status); }
  return res.status===204?null:res.json();
}

    S.now=me.now; S.name=me.name||""; S.role=me.role||"common"; S.modules=me.modules||[];

// ---------------- helpers ----------------
function nowLocalDate(){ const n=S.now||{y:2026,mo:1,d:1,hh:12,mi:0}; return new Date(n.y,n.mo-1,n.d,n.hh,n.mi); }
function dayLabel(y,mo,d){
  const base=nowLocalDate(); const a=new Date(base.getFullYear(),base.getMonth(),base.getDate());
  const b=new Date(y,mo-1,d); const diff=Math.round((b-a)/86400000);
  if(diff===0) return T("today"); if(diff===1) return T("tomorrow");
  if(diff>1&&diff<7) return WDAY[S.lang][(b.getDay()+6)%7];
  return pad(d)+"."+pad(mo);
}
function whenLabel(r){ return dayLabel(r.y,r.mo,r.d)+" · "+pad(r.hh)+":"+pad(r.mi); }
function repeatDesc(r){
  if(r.kind==="interval"){ const s=r.interval_seconds; let n,u;
    if(s%86400===0){n=s/86400;u=T("u_days");} else if(s%3600===0){n=s/3600;u=T("u_hours");}
    else {n=Math.round(s/60);u=T("u_minutes");}
    return T("every")+" "+n+" "+u; }
  return T("rk_"+r.kind);
}
// resolve draft -> API create payload
function toLocalYMD(dt){ return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()); }
function buildPayload(){
  const d=S.draft, base=nowLocalDate();
  const text=d.text.trim();
  const at=(dd,h,m)=>{const x=new Date(dd);x.setHours(h,m,0,0);return x;};
  if(d.path==="hours"){
    if(d.hoursMode==="count"){ const f=new Date(base.getTime()+d.hoursCount*3600000+(d.minuteCount||0)*60000);
      return {text,kind:"once",date:toLocalYMD(f),time:pad(f.getHours())+":"+pad(f.getMinutes())}; }
    let f=at(base,d.hourOfDay,d.minute); if(f<=base) f=new Date(f.getTime()+86400000);
    return {text,kind:"once",date:toLocalYMD(f),time:pad(d.hourOfDay)+":"+pad(d.minute)};
  }
  if(d.path==="days"){
    const map={week:7,month:30,half:182,year:365}; const days=map[d.dayN]||d.dayN;
    let f=new Date(base.getTime()+days*86400000);
    const h=d.sameTime?base.getHours():d.hourOfDay, m=d.sameTime?base.getMinutes():d.minute;
    return {text,kind:"once",date:toLocalYMD(f),time:pad(h)+":"+pad(m)};
  }
  // exact
  const time=pad(d.hourOfDay)+":"+pad(d.minute);
  if(d.repeatKind==="daily") return {text,kind:"daily",time};
  if(d.repeatKind==="interval"){
    const u={minutes:60,hours:3600,days:86400}[d.intervalUnit]; const secs=d.intervalN*u;
    if(d.intervalStart==="now") return {text,kind:"interval",interval_seconds:secs,start_now:true};
    const dd=d.customDate||base; return {text,kind:"interval",interval_seconds:secs,start_now:false,
      date:toLocalYMD(dd),time};
  }
  if(d.repeatKind==="weekly"){
    // next date matching weekday (0=Mon..6=Sun in our WDAY, JS getDay Sun=0)
    let f=new Date(base); const targetJs=(d.weekday+1)%7; // Mon(0)->1 ... Sun(6)->0
    for(let i=0;i<8;i++){ if(f.getDay()===targetJs && f>=base){break;} f=new Date(f.getTime()+86400000);}
    return {text,kind:"weekly",date:toLocalYMD(f),time};
  }
  if(d.repeatKind==="monthly"){
    let f=new Date(base.getFullYear(),base.getMonth(),d.monthDay);
    if(f<base) f=new Date(base.getFullYear(),base.getMonth()+1,d.monthDay);
    return {text,kind:"monthly",date:toLocalYMD(f),time};
  }
  // once
  let dd=base;
  if(d.dateChoice==="tomorrow") dd=new Date(base.getTime()+86400000);
  else if(d.dateChoice==="other"&&d.customDate) dd=d.customDate;
  return {text,kind:"once",date:toLocalYMD(dd),time};
}
function draftFire(){
  const p=buildPayload(); const base=nowLocalDate();
  if(p.kind==="interval"&&p.start_now){ const u={minutes:60,hours:3600,days:86400}[S.draft.intervalUnit];
    return new Date(base.getTime()+S.draft.intervalN*u*1000); }
  const [Y,Mo,D]=p.date.split("-").map(Number); const [H,Mi]=p.time.split(":").map(Number);
  return new Date(Y,Mo-1,D,H,Mi);
}

// ---------------- element builders ----------------
function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==="style") e.setAttribute("style",attrs[k]);
    else if(k==="class") e.className=attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==="disabled"){ if(attrs[k]) e.setAttribute("disabled",""); }
    else e.setAttribute(k,attrs[k]);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false)continue;
    e.appendChild(typeof kid==="string"||typeof kid==="number"?document.createTextNode(String(kid)):kid); }
  return e;
}
function seg(opts,val,on){ return h("div",{class:"seg"},opts.map(o=>

// Нативные поля вместо самодельного колеса: надёжно в вебвью Telegram и не рушат
// скролл (самодельное колесо ломалось, т.к. render() пересобирал DOM при скролле).
// Сетка чисел: тап выбирает и подсвечивает значение (держится), подтверждение —
// кнопкой внизу. Никаких нативных выпадающих пикеров, что закрывались сами.
function numberGrid(items,val,on,cols){
  return h("div",{class:"ngrid",style:"grid-template-columns:repeat("+(cols||6)+",1fr)"},
    items.map(n=>h("button",{class:"ncell"+(n===val?" on":""),onClick:()=>on(n)}, String(n))));
}

function scCalendar(){
  const d=S.draft; const base=d.customDate||nowLocalDate();
  const y=base.getFullYear(), m=base.getMonth();
  const startDow=(new Date(y,m,1).getDay()+6)%7; const days=new Date(y,m+1,0).getDate();
  const now=nowLocalDate(); const isPast=dd=>new Date(y,m,dd)<new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const cells=[]; for(let i=0;i<startDow;i++)cells.push(null); for(let i=1;i<=days;i++)cells.push(i);
  const nav=delta=>()=>setDraft({customDate:new Date(y,m+delta,Math.min(base.getDate(),28))});
  return h("div",{class:"pad"},
    h("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"},
      h("button",{class:"lnk",onClick:nav(-1)},"‹"),

      h("button",{class:"lnk",onClick:nav(1)},"›")),
    h("div",{class:"grid7",style:"margin-bottom:6px"}, WDAY[S.lang].map(w=>
      h("div",{style:"text-align:center;font-size:11px;color:var(--hint);font-weight:600"},w.slice(0,2)))),
    h("div",{class:"grid7"}, cells.map((c,i)=>{
      if(c===null) return h("div",{});
      const sel=d.customDate&&d.customDate.getDate()===c&&d.customDate.getMonth()===m&&d.customDate.getFullYear()===y;
      const past=isPast(c);
      return h("button",{class:"cell",disabled:past,
        style:"aspect-ratio:1;border-radius:50%;background:"+(sel?"var(--acc)":"transparent")+";color:"+(sel?"var(--btntext)":past?"var(--divs)":"var(--text)")+";opacity:"+(past?.5:1),
        onClick:past?null:()=>{setDraft({customDate:new Date(y,m,c),dateChoice:"other"});back();}}, c);
    })));
}

  if(cs.state==="loading") return h("div",{},h("div",{class:"spinner"}));
  if(cs.state==="error") return centerState("⚠️",T("errTitle"),T("errBody"),
    h("button",{class:"pill",onClick:()=>loadNotes(cs.id)},T("retry")));
  if(!cs.notes.length) return h("div",{}, emptyBlock("📝",T("noNotes"),T("noNotesBody")), del);
  const head=h("div",{class:"sectitle"}, cs.notes.length+" "+T("notesLc"), "");
  const rows=cs.notes.map(n=>h("div",{class:"row",onClick:()=>openNote(n.id)},
    h("div",{class:"ic",style:"background:var(--accsoft)"},"📝"),
    h("div",{class:"meta"}, h("div",{class:"txt",style:"margin-top:0"}, firstLine(n.text))),
    h("div",{style:"color:var(--divs)"},"›")));
  return h("div",{}, h("div",{style:"padding:8px 0 4px"}, head, h("div",{class:"card"}, rows)), del);
}
function scNNote(){
  const n=(S.curShelf.notes||[]).find(x=>x.id===S.noteId);
  if(!n) return centerState("📝",T("note"),"—",h("button",{class:"pill",onClick:back},T("back")));
  return h("div",{style:"padding:16px 14px"},
    h("div",{class:"notecard"}, n.text),
    h("div",{class:"editbtns"},
      h("button",{class:"edit",onClick:()=>startEditNote(n)},"✏️ "+T("edit")),
      h("button",{class:"del",onClick:()=>{S.dialog={type:"delNote",id:n.id};render();}},"🗑 "+T("delete"))));
}
function scNNoteEdit(){
  const ta=h("textarea",{class:"ta",placeholder:T("notePh"),maxlength:"4000",oninput:e=>{
    S.noteDraft=e.target.value; const c=document.getElementById("ncounter");
    if(c)c.textContent=e.target.value.length+" / 4000"; updateMain();}});
  ta.value=S.noteDraft; setTimeout(()=>ta.focus(),50);
  return h("div",{class:"pad"}, ta, h("div",{class:"counter",id:"ncounter"}, S.noteDraft.length+" / 4000"));
}
function scNShelfName(){
  const inp=h("input",{class:"tin",placeholder:T("shelfNamePh"),maxlength:"255",oninput:e=>{
    S.nameDraft=e.target.value; const c=document.getElementById("scounter");
    if(c)c.textContent=e.target.value.length+" / 255"; updateMain();}});
  inp.value=S.nameDraft; setTimeout(()=>inp.focus(),50);
  return h("div",{class:"pad"},
    h("div",{class:"slab"},T("shelfName")), inp,
    h("div",{class:"counter",id:"scounter"}, S.nameDraft.length+" / 255"));
}
function renderSheet(){
  let content;
  if(S.sheet==="lang"){
    const langs=[["en","English"],["ru","Русский"],["de","Deutsch"],["uk","Українська"]];
    content=h("div",{},
      h("div",{class:"lab",style:"margin:2px 4px 12px"},T("chooseLang")),
      h("div",{class:"langlist"}, langs.map(([code,label])=>
        h("button",{onClick:()=>pickLang(code)}, h("span",{},label), S.lang===code?h("span",{style:"color:var(--acc)"},"✓"):""))));
  } else if(S.sheet==="prime"){
    content=sheetMsg("⭐",T("primeTitle"),T("primeBody"),T("requestAccess"),()=>guard(doPrimeRequest));
  } else if(S.sheet==="maint"){
    content=sheetMsg("🔧",T("maintTitle"),T("maintBody"),T("gotIt"),()=>{S.sheet=null;render();});
  }
  const wrap=h("div",{class:"sheetwrap",onClick:e=>{if(e.target===wrap&&!S.busy){S.sheet=null;render();}}},
    h("div",{class:"sheet"}, h("div",{class:"handle"}), content));
  return wrap;
}
function sheetMsg(em,title,body,cta,onCta){
  return h("div",{class:"msg"},
    h("div",{class:"cir"},em), h("h3",{},title), h("p",{},body),
    h("div",{style:"display:flex;flex-direction:column;gap:8px"},
      h("button",{class:"dbtn",style:"background:var(--acc);color:var(--btntext)",disabled:S.busy,onClick:S.busy?null:onCta}, S.busy?"…":cta),
      h("button",{class:"dbtn cancel",disabled:S.busy,onClick:S.busy?null:()=>{S.sheet=null;render();}},T("cancel"))));
}
function openModule(m){
  if(m.disabled && S.role!=="admin"){ S.sheet="maint"; render(); return; }
  if(m.prime_only && S.role==="common"){ S.sheet="prime"; render(); return; }
  if(m.key==="reminders"){ go("list"); loadList(); return; }
  if(m.key==="memory"){ S.nbulk={on:false,sel:[]}; go("nshelves"); loadShelves(); return; }
  S.moduleKey=m.key; go("modstub");
}
async function doAgree(){ await api("/api/consent",{method:"POST"}); menu(); }
async function doPrimeRequest(){ await api("/api/prime_request",{method:"POST"}); S.sheet=null; toast(T("requested")); }
function pickLang(code){
  S.lang=code; S.sheet=null; render();
  api("/api/lang",{method:"POST",body:{lang:code}}).catch(()=>{}); // сохранить как в боте (не критично)
}

function renderDialog(){
  const dg=S.dialog; let title,body="",yes,onYes;
  if(dg.type==="delSel"){ title=T("confirmDelSel"); yes=T("del"); onYes=async()=>{ await api("/api/reminders/bulk_delete",{method:"POST",body:{ids:S.bulk.sel}}); S.bulk={on:false,sel:[]}; S.dialog=null; await loadList(); }; }
  else if(dg.type==="delAll"){ title=T("confirmDelAll"); yes=T("deleteAll"); onYes=async()=>{ await api("/api/reminders/delete_all",{method:"POST"}); S.bulk={on:false,sel:[]}; S.dialog=null; await loadList(); }; }
  else if(dg.type==="delOne"){ title=T("confirmDelOne"); yes=T("del"); onYes=async()=>{ await api("/api/reminders/"+dg.id,{method:"DELETE"}); S.dialog=null; S.screen="list"; S.history=[]; await loadList(); }; }
  else if(dg.type==="delShelf"){ title=T("delShelfTitle"); body=T("delShelfBody"); yes=T("delete"); onYes=async()=>{ await api("/api/shelves/"+dg.id,{method:"DELETE"}); S.dialog=null; S.screen="nshelves"; S.history=["home"]; await loadShelves(); toast(T("deleted")); }; }
  else if(dg.type==="delShelvesSel"){ title=T("delShelvesTitle").replace("{n}",S.nbulk.sel.length); body=T("delShelvesBody"); yes=T("delete"); onYes=async()=>{ await api("/api/shelves/bulk_delete",{method:"POST",body:{ids:S.nbulk.sel}}); S.nbulk={on:false,sel:[]}; S.dialog=null; await loadShelves(); toast(T("deleted")); }; }
  else if(dg.type==="delNote"){ title=T("delNoteTitle"); body=T("delOneBody"); yes=T("delete"); onYes=async()=>{ await api("/api/notes/"+dg.id,{method:"DELETE"}); S.dialog=null; S.screen="nshelf"; S.history=["home","nshelves"]; await loadNotes(S.curShelf.id); toast(T("deleted")); }; }
  return h("div",{class:"overlay",onClick:e=>{if(e.target.className==="overlay"&&!S.busy){S.dialog=null;render();}}},
    h("div",{class:"dialog"}, h("h3",{},title), body?h("p",{},body):"",
      h("div",{class:"btns"},
        h("button",{class:"dbtn danger",disabled:S.busy,onClick:S.busy?null:()=>guard(onYes)},
          S.busy?"…":yes),
        h("button",{class:"dbtn cancel",disabled:S.busy,onClick:S.busy?null:()=>{S.dialog=null;render();}},T("cancel")))));
}

// ---------------- actions ----------------
function startNew(){ S.draft=freshDraft(); go("when"); }
function selectAll(){ S.bulk.sel = S.bulk.sel.length===S.reminders.length?[]:S.reminders.map(r=>r.id); render(); }
function toggleSel(id){ const i=S.bulk.sel.indexOf(id); if(i>=0)S.bulk.sel.splice(i,1); else S.bulk.sel.push(id); render(); }
function openDetail(id){ S.detailId=id; go("detail"); }
// ---- Полка памяти (Notes): действия ----
function startNewShelf(){ S.nameDraft=""; go("nnewshelf"); }
function startRenameShelf(id){ const s=S.shelves.find(x=>x.id===id); S.renameId=id; S.nameDraft=s?s.title:""; go("nrenameshelf"); }
function openShelf(s){ S.curShelf={id:s.id,title:s.title,notes:[],state:"loading"}; go("nshelf"); loadNotes(s.id); }
function openNote(id){ S.noteId=id; go("nnote"); }
function startNewNote(){ S.noteDraft=""; S.editingNote=false; go("nnoteedit"); }
function startEditNote(n){ S.noteDraft=n.text; S.editingNote=true; go("nnoteedit"); }
function selectAllShelves(){ S.nbulk.sel = S.nbulk.sel.length===S.shelves.length?[]:S.shelves.map(s=>s.id); render(); }
function toggleShelfSel(id){ const i=S.nbulk.sel.indexOf(id); if(i>=0)S.nbulk.sel.splice(i,1); else S.nbulk.sel.push(id); render(); }
async function doCreateShelf(){ const t=S.nameDraft.trim(); if(!t)return;
  await api("/api/shelves",{method:"POST",body:{title:t}}); back(); await loadShelves(); toast(T("shelfCreated")); }
async function doRenameShelf(){ const t=S.nameDraft.trim(); if(!t)return;
  await api("/api/shelves/"+S.renameId,{method:"PATCH",body:{title:t}});
  S.nbulk={on:false,sel:[]}; back(); await loadShelves(); toast(T("saved")); }
async function doSaveNote(){ const t=S.noteDraft.trim(); if(!t)return;
  if(S.editingNote) await api("/api/notes/"+S.noteId,{method:"PATCH",body:{text:t}});
  else await api("/api/shelves/"+S.curShelf.id+"/notes",{method:"POST",body:{text:t}});
  await loadNotes(S.curShelf.id); back(); toast(T("saved")); }
async function doToggle(id){ const r=await api("/api/reminders/"+id+"/toggle",{method:"POST"});
  const i=S.reminders.findIndex(x=>x.id===id); if(i>=0)S.reminders[i]=r; }
function startEditText(r){ S.editId=r.id; S.editMode="text"; S.draft=freshDraft(); S.draft.text=r.text; go("text"); }
function startEditTime(r){ S.editId=r.id; S.editMode="time"; S.draft=freshDraft(); go("when"); }
// Единый шлюз: пока идёт запрос — S.busy=true, кнопки заблокированы (нет двойного
// добавления/удаления), показываем «…». Ошибки — тостом.
async function guard(fn){
  if(S.busy) return;
  S.busy=true; render();
  try{ await fn(); }
  catch(e){ toast(e&&e.message==="http 400"?T("pastErr"):T("errGeneric")); }
  finally{ S.busy=false; render(); }
}
async function doCreate(){ const nr=await api("/api/reminders",{method:"POST",body:buildPayload()});
  S.reminders.unshift(nr); home(); toast(T("created")); }
async function doSaveSchedule(){ const nr=await api("/api/reminders/"+S.editId+"/schedule",{method:"PATCH",body:buildPayload()});
  const i=S.reminders.findIndex(x=>x.id===S.editId); if(i>=0)S.reminders[i]=nr; home(); toast(T("saved")); }
async function doSaveText(){ const nr=await api("/api/reminders/"+S.editId,{method:"PATCH",body:{text:S.draft.text.trim()}});
  const i=S.reminders.findIndex(x=>x.id===S.editId); if(i>=0)S.reminders[i]=nr;
  const id=S.editId; S.editMode=null; S.editId=null; S.detailId=id; S.screen="detail"; S.history=["list"]; toast(T("saved")); }

// ---------------- shell / main button ----------------
function screenMeta(){
  switch(S.screen){
    case "home": return {title:"",back:false};
    case "consent": return {title:T("consentTitle"),back:false};
    case "modstub": return {title:moduleTitle(S.moduleKey),back:true};
    case "nshelves": return {title: S.nbulk.on?(S.nbulk.sel.length?S.nbulk.sel.length+" "+T("selected"):T("selectItems")):T("m_memory"), back:false};
    case "nshelf": return {title:S.curShelf.title||T("m_memory"), back:true};
    case "nnote": return {title:T("note"), back:true};
    case "nnoteedit": return {title:S.editingNote?T("editNote"):T("newNote"), back:true};
    case "nnewshelf": return {title:T("newShelf"), back:true};
    case "nrenameshelf": return {title:T("rename"), back:true};
    case "list": return {title: S.bulk.on?(S.bulk.sel.length?S.bulk.sel.length+" "+T("selected"):T("selectItems")):T("reminders"), back:false};
    case "when": return {title:T("newReminder"),back:true};
    case "hours": return {title:T("inHoursTitle"),back:true};
    case "days": return {title:T("inDaysTitle"),back:true};
    case "exact": return {title:T("exactTitle"),back:true};
    case "calendar": return {title:T("pickDate"),back:true};
    case "time": return {title:T("pickTime"),back:true};
    case "text": return {title:T("reminderText"),back:true};
    case "detail": return {title:T("reminder"),back:true};
    default: return {title:T("reminders"),back:false};
  }
}
function mainCfg(){
  if(S.screen==="nshelves"&&!S.nbulk.on&&S.shelvesState==="ready"&&S.shelves.length) return {label:"＋ "+T("newShelf"),on:startNewShelf};
  if(S.screen==="nshelves"&&S.nbulk.on) return {label:T("deleteSelected")+(S.nbulk.sel.length?" ("+S.nbulk.sel.length+")":""),danger:true,disabled:!S.nbulk.sel.length,on:()=>{S.dialog={type:"delShelvesSel"};render();}};
  if(S.screen==="nshelf"&&S.curShelf.state==="ready") return {label:"＋ "+T("newNote"),on:startNewNote};
  if(S.screen==="nnoteedit") return {label:T("save"),on:()=>guard(doSaveNote),disabled:!S.noteDraft.trim()};
  if(S.screen==="nnewshelf") return {label:T("create"),on:()=>guard(doCreateShelf),disabled:!S.nameDraft.trim()};
  if(S.screen==="nrenameshelf") return {label:T("save"),on:()=>guard(doRenameShelf),disabled:!S.nameDraft.trim()};
  if(S.screen==="list"&&!S.bulk.on&&(S.listState==="normal"||S.listState==="empty")) return {label:"＋ "+T("newReminder"),on:startNew};
  if(S.screen==="list"&&S.bulk.on) return {label:T("deleteSelected")+(S.bulk.sel.length?" ("+S.bulk.sel.length+")":""),danger:true,disabled:!S.bulk.sel.length,on:()=>{S.dialog={type:"delSel"};render();}};
  if(S.screen==="hours"||S.screen==="days"||S.screen==="exact"){
    // 0 ч + 0 мин в «через N часов» = «сейчас» (прошлое) -> блокируем
    const bad = S.screen==="hours" && S.draft.hoursMode==="count" && !S.draft.hoursCount && !S.draft.minuteCount;
    return S.editMode==="time" ? {label:T("save"),on:()=>guard(doSaveSchedule),disabled:bad}
                               : {label:T("next"),on:()=>go("text"),disabled:bad};
  }
  if(S.screen==="time"||S.screen==="calendar") return {label:T("confirm"),on:back};
  if(S.screen==="text")
    return S.editMode==="text"
      ? {label:T("save"),on:()=>guard(doSaveText),disabled:!S.draft.text.trim()}
      : {label:T("create"),on:()=>guard(doCreate),disabled:!S.draft.text.trim()};
  return null;
}
function updateMain(){
  const cfg=mainCfg();
  // Одна кнопка — только своя в футере. Нативную Telegram MainButton прячем,
  // чтобы внизу никогда не было двух кнопок с одинаковым текстом.
  if(tg && tg.MainButton) tg.MainButton.hide();
  const foot=document.getElementById("foot");
  if(foot){ foot.innerHTML="";
    if(cfg){ const dis=cfg.disabled||S.busy;
      foot.appendChild(h("button",{class:"mainbtn"+(cfg.danger?" danger":""),
        disabled:dis, onClick:dis?null:cfg.on}, S.busy?"…":cfg.label)); } }
}

// ---------------- render ----------------
function render(){
  const root=document.getElementById("root");
  const meta=screenMeta();
  const app=h("div",{class:"app","data-theme":S.theme});
  // корневой экран модуля: ‹ Назад из него ведёт в меню (родитель = Домой)
  const listRoot = S.screen==="list" && !S.bulk.on;
  const nshelfRoot = S.screen==="nshelves" && !S.nbulk.on;
  const showBack = meta.back || listRoot || nshelfRoot;
  const globe=()=>h("button",{class:"lnk",style:"font-size:13px;color:var(--hint)",
    onClick:()=>{S.sheet="lang";render();}},"🌐 "+S.lang.toUpperCase());
  // header
  let left;
  if(S.screen==="home"||S.screen==="consent") left=globe();
  else if(showBack) left=h("button",{class:"lnk",onClick:back},"‹ "+T("back"));
  else left=h("div",{});
  let right;
  if(S.screen==="list"&&S.bulk.on) right=h("button",{class:"lnk",onClick:()=>{S.bulk={on:false,sel:[]};render();}},T("done"));
  else if(S.screen==="list"&&S.reminders.length&&S.listState==="normal") right=h("button",{class:"lnk",onClick:()=>{S.bulk={on:true,sel:[]};render();}},T("select"));
  else if(S.screen==="nshelves"&&S.nbulk.on) right=h("button",{class:"lnk",onClick:()=>{S.nbulk={on:false,sel:[]};render();}},T("done"));
  else if(S.screen==="nshelves"&&S.shelves.length&&S.shelvesState==="ready") right=h("button",{class:"lnk",onClick:()=>{S.nbulk={on:true,sel:[]};render();}},T("select"));
  else right=h("div",{});
  app.appendChild(h("div",{class:"hdr"}, h("div",{class:"side"},left),
    h("div",{class:"title"},meta.title), h("div",{class:"side r"},right)));
  // body
  let body;
  switch(S.screen){
    case "home": body=scHome();break; case "consent": body=scConsent();break; case "modstub": body=scModStub();break;
    case "nshelves": body=scNShelves();break; case "nshelf": body=scNShelf();break; case "nnote": body=scNNote();break;
    case "nnoteedit": body=scNNoteEdit();break; case "nnewshelf": case "nrenameshelf": body=scNShelfName();break;
    case "list": body=scList();break; case "when": body=scWhen();break; case "hours": body=scHours();break;
    case "days": body=scDays();break; case "exact": body=scExact();break; case "calendar": body=scCalendar();break;
    case "time": body=scTime();break; case "text": body=scText();break; case "detail": body=scDetail();break;
    default: body=scHome();
  }
  app.appendChild(h("div",{class:"body"+(S.screen==="consent"?" ":""),style:S.screen==="consent"?"display:flex;flex-direction:column":""}, body));
  app.appendChild(h("div",{id:"foot",class:"foot"}));
  root.innerHTML=""; root.appendChild(app);
  if(S.toast) app.appendChild(h("div",{class:"toast"},"✅ "+S.toast));
  if(S.dialog) app.appendChild(renderDialog());
  if(S.sheet) app.appendChild(renderSheet());
  // telegram BackButton
  if(tg && tg.BackButton){ if(showBack) tg.BackButton.show(); else tg.BackButton.hide(); }
  updateMain();
}

// ---------------- init ----------------
function applyInsets(){
  if(!tg) return;
  const sa=tg.safeAreaInset||{}, ca=tg.contentSafeAreaInset||{};
  // в фуллскрине сверху статус-бар устройства (safeAreaInset) + кнопки Telegram
  // (contentSafeAreaInset) — сдвигаем контент вниз, иначе шапка налезет.
  document.documentElement.style.setProperty("--tg-safe-top",((sa.top||0)+(ca.top||0))+"px");
}
if(tg){ tg.ready(); tg.expand();
  if(tg.requestFullscreen){ try{ tg.requestFullscreen(); }catch(e){} }  // Bot API 8.0+: полноэкранный режим
  applyInsets();
  try{ const lc=(tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code||"en").slice(0,2);
    if(["ru","de","uk","en"].includes(lc)) S.lang=lc; }catch(e){}
  const re=(ev,fn)=>tg.onEvent&&tg.onEvent(ev,fn);
  re("themeChanged",()=>{ S.theme=tg.colorScheme; render(); });
  re("fullscreenChanged",applyInsets); re("safeAreaChanged",applyInsets); re("contentSafeAreaChanged",applyInsets);
  re("viewportChanged",applyInsets);
  tg.BackButton&&tg.BackButton.onClick(()=>back());
}
render();
loadMe();
</script>
</body>
</html>
